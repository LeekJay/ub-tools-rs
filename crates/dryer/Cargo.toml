[package]
name = "dryer"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false
description = "Pure Rust port of unclebob/dryer (structural duplicate finder)"

[lib]
name = "dryer_core"
path = "src/lib.rs"

[[bin]]
name = "dryer"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "=0.23.6"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-vue-next = "0.1.0"
ub-runtime = { path = "../ub-runtime" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
